name: Build

on: push

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11

            - name: Install dependencies
              run: pnpm install

            - name: Build public
              run: pnpm build

            - name: Package public
              id: package_public
              shell: bash
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  COUNT=$(git rev-list --count HEAD)
                  HASH=$(git rev-parse --short=7 HEAD)
                  ARTIFACT_NAME="oaa-fe-v${VERSION}-${COUNT}-g${HASH}-public"
                  echo "name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
                  zip -r "${ARTIFACT_NAME}.zip" dist

            - name: Upload public artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ steps.package_public.outputs.name }}
                  path: ${{ steps.package_public.outputs.name }}.zip

            - name: Build internal
              run: pnpm build:internal

            - name: Package internal
              id: package_internal
              shell: bash
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  COUNT=$(git rev-list --count HEAD)
                  HASH=$(git rev-parse --short=7 HEAD)
                  ARTIFACT_NAME="oaa-fe-v${VERSION}-${COUNT}-g${HASH}-internal"
                  echo "name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
                  zip -r "${ARTIFACT_NAME}.zip" dist

            - name: Upload internal artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ steps.package_internal.outputs.name }}
                  path: ${{ steps.package_internal.outputs.name }}.zip
