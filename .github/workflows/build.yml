name: Build

on:
    push:
        branches:
            - main
        paths:
            - '**'
            - '!**.md'
            - '!.github/**'
            - '.github/workflows/**'
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 26

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Install dependencies
              run: pnpm install

            - name: Prebuild Checks
              run: |
                pnpm lint
                pnpm type-check

            - name: Unit tests
              run: pnpm test:coverage

            - name: Upload coverage
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: coverage
                  path: coverage/
                  retention-days: 7

            - name: Build
              run: pnpm build

            - name: Package
              id: package
              shell: bash
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  COUNT=$(git rev-list --count HEAD)
                  HASH=$(git rev-parse --short=7 HEAD)
                  ARTIFACT_NAME="oaa-fe-v${VERSION}-${COUNT}-g${HASH}"
                  echo "name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
                  zip -r "${ARTIFACT_NAME}.zip" dist

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ steps.package.outputs.name }}
                  path: ${{ steps.package.outputs.name }}.zip
